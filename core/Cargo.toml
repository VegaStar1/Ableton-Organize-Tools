[package]
name = "organizer-core"
version = "0.1.0"
edition = "2021"
description = "Scanning and analysis engine for Debridr"
license = "MIT"

[lib]
name = "organizer_core"

[[bin]]
name = "organizer-cli"
path = "src/bin/organizer-cli.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
flate2 = "1"
quick-xml = "0.37"
zip = { version = "2", default-features = false, features = ["deflate"] }
jwalk = "0.8"
rayon = "1"
aho-corasick = "1"
blake3 = "1"
dirs = "6"
percent-encoding = "2"
clap = { version = "4", features = ["derive"] }
symphonia = { version = "0.5", default-features = false, features = ["wav", "pcm", "aiff", "flac", "mp3", "ogg", "vorbis", "isomp4", "aac", "adpcm", "caf"] }

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
