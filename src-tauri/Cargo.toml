[package]
name = "ableton-organizer"
version = "0.1.0"
edition = "2021"
description = "Find unused plugins and samples across your DAW projects"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
organizer-core = { path = "../core" }
dirs = "6"

[features]
# Embeds the UI into the .exe so a plain `cargo build --release` gives a standalone app.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
