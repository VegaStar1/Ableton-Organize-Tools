name: build
on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p organizer-core

  bundle:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: ""
            dir: target/release/bundle
          - os: macos-latest
            args: "--target universal-apple-darwin"
            dir: target/universal-apple-darwin/release/bundle
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo install tauri-cli --version "^2" --locked
      - run: cargo tauri build ${{ matrix.args }}
      - uses: actions/upload-artifact@v4
        with:
          name: ableton-organizer-${{ matrix.os }}
          path: |
            ${{ matrix.dir }}/nsis/*.exe
            ${{ matrix.dir }}/msi/*.msi
            ${{ matrix.dir }}/dmg/*.dmg
